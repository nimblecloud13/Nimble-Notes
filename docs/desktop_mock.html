<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop mock</title>
<style>
/* A made-up Windows 11 desktop for the Nimble Notes intro screenshots: Nimble Notes pinned to the left strip,
   Firefox maximized beside it. ?mode=sixth (GitHub) or ?mode=eighth (Google). Rendered at 2560x1440. */
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2560px;height:1440px;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#0b1a33}
.wall{position:absolute;inset:0;background:radial-gradient(1200px 700px at 70% 55%,#3a7bd5 0%,#1e3c72 40%,#0b1a33 75%)}
/* ---------------- Nimble Notes, pinned at the left */
.nn{position:absolute;left:0;top:0;height:1392px;background:#13161e;border-right:1px solid #2a2f3d;box-shadow:0 0 24px rgba(0,0,0,.45);z-index:3}
.nn .bar{height:31px;display:flex;align-items:center;background:#13161e;color:#e8ecf6;font-size:12px;padding-left:10px;gap:8px}
.nn .bar .ico{width:16px;height:16px;border-radius:4px;background:#f59e0b;position:relative}
.nn .bar .ico:before,.nn .bar .ico:after{content:"";position:absolute;left:4px;right:3px;height:1.6px;background:#13161e;border-radius:1px}
.nn .bar .ico:before{top:5px}.nn .bar .ico:after{top:9px;right:5px}
.nn .bar .t{flex:1}
.wc{display:flex;height:100%}
.wc span{width:46px;display:flex;align-items:center;justify-content:center;color:#e8ecf6}
.wc svg{width:10px;height:10px}
.nn img{display:block}
/* ---------------- Firefox */
.ff{position:absolute;top:0;right:0;height:1392px;background:#1c1b22;display:flex;flex-direction:column;z-index:2}
.tabs{height:44px;background:#1c1b22;display:flex;align-items:flex-end;padding:0 0 0 8px;gap:4px;position:relative}
.tab{height:36px;margin-bottom:4px;border-radius:6px;display:flex;align-items:center;gap:9px;padding:0 10px 0 12px;color:#fbfbfe;font-size:12.5px;width:240px}
.tab.on{background:#42414d;box-shadow:0 0 4px rgba(0,0,0,.4)}
.tab.off{border:1px solid #52525e}
.tab .tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent)}
.tab .x{width:16px;height:16px;display:flex;align-items:center;justify-content:center;opacity:.9}
.plus{width:32px;height:32px;margin-bottom:6px;display:flex;align-items:center;justify-content:center;color:#fbfbfe;border-radius:6px}
.tabs .wc{position:absolute;right:0;top:0;height:36px}
.tabs .wc span{width:48px}
.nav{height:44px;background:#2b2a33;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid #0c0c0d}
.nb{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#fbfbfe}
.nb svg{width:16px;height:16px}
.url{flex:1;height:32px;margin:0 6px;border-radius:5px;background:#1c1b22;display:flex;align-items:center;gap:8px;padding:0 10px;color:#fbfbfe;font-size:14px}
.url .dim{color:#8f8f9d}
.page{flex:1;overflow:hidden;position:relative}
/* ---------------- GitHub (dark), made up from the public profile */
.gh{background:#0d1117;height:100%;color:#e6edf3;font-size:14px}
.gh .top{height:64px;background:#010409;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:16px;padding:0 24px}
.gh .top .who{font-weight:600;font-size:14px}
.gh .top .srch{margin-left:auto;width:280px;height:32px;border:1px solid #30363d;border-radius:6px;color:#7d8590;display:flex;align-items:center;padding:0 10px;font-size:13px;gap:8px}
.gh .tabsg{height:48px;border-bottom:1px solid #30363d;display:flex;align-items:flex-end;gap:6px;padding:0 24px}
.gh .tg{padding:0 10px 12px;font-size:14px;color:#e6edf3;display:flex;gap:8px;align-items:center}
.gh .tg.on{border-bottom:2px solid #f78166;font-weight:600}
.gh .tg .n{background:#30363d;border-radius:20px;padding:0 7px;font-size:12px}
.gh .wrap{max-width:1280px;margin:0 auto;display:flex;gap:28px;padding:32px 24px}
.gh .side{width:296px;flex:none}
.gh .av{width:296px;height:296px;border-radius:50%;border:1px solid #30363d;background:#161b22;display:flex;align-items:center;justify-content:center;overflow:hidden}
.gh .av img{width:78%;height:78%;object-fit:contain}
.gh h1{font-size:26px;font-weight:600;margin-top:16px;line-height:1.25}
.gh .login{font-size:20px;color:#7d8590;font-weight:300}
.gh .bio{margin:14px 0;font-size:16px}
.gh .btn{height:32px;border:1px solid #30363d;border-radius:6px;background:#21262d;display:flex;align-items:center;justify-content:center;font-weight:500}
.gh .meta{color:#7d8590;margin-top:14px;line-height:1.9}
.gh .meta b{color:#e6edf3}
.gh .main{flex:1;min-width:0}
.gh .h2{font-size:16px;margin-bottom:10px}
.gh .pins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gh .card{border:1px solid #30363d;border-radius:6px;padding:16px;min-height:128px;display:flex;flex-direction:column}
.gh .card .nm{color:#4493f8;font-weight:600;display:flex;align-items:center;gap:8px}
.gh .card .pub{border:1px solid #30363d;border-radius:20px;color:#7d8590;font-size:12px;padding:0 7px;font-weight:500}
.gh .card .ds{color:#7d8590;font-size:12px;margin:8px 0 14px;flex:1;line-height:1.5}
.gh .card .ft{color:#7d8590;font-size:12px;display:flex;gap:16px;align-items:center}
.gh .dot{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px}
.gh .contrib{margin-top:28px}
.gh .cal{border:1px solid #30363d;border-radius:6px;padding:16px 16px 10px}
.gh .grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px}
.gh .grid i{width:11px;height:11px;border-radius:2px;display:block}
.gh .legend{color:#7d8590;font-size:12px;display:flex;justify-content:space-between;margin-top:8px}
/* ---------------- Google */
.gg{background:#fff;height:100%;color:#202124;font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center}
.gg .gtop{align-self:stretch;height:60px;display:flex;justify-content:flex-end;align-items:center;gap:15px;padding:0 20px;font-size:13px}
.gg .apps{width:40px;height:40px;display:grid;grid-template-columns:repeat(3,4px);gap:4px;place-content:center}
.gg .apps i{width:4px;height:4px;background:#5f6368;border-radius:50%}
.gg .sign{background:#1a73e8;color:#fff;border-radius:4px;padding:9px 23px;font-weight:500}
.gg .logo{margin-top:300px;font-family:'Product Sans','Segoe UI',Arial,sans-serif;font-size:118px;letter-spacing:-5px;font-weight:500;line-height:1}
.gg .box{margin-top:34px;width:584px;height:46px;border:1px solid #dfe1e5;border-radius:24px;display:flex;align-items:center;gap:13px;padding:0 16px;box-shadow:0 1px 6px rgba(32,33,36,.18)}
.gg .box .q{flex:1;font-size:16px;color:#202124}
.gg .btns{display:flex;gap:12px;margin-top:29px}
.gg .btns span{background:#f8f9fa;border:1px solid #f8f9fa;border-radius:4px;padding:0 16px;height:36px;line-height:36px;font-size:14px;color:#3c4043}
.gg .lang{margin-top:28px;font-size:13px;color:#4d5156}
.gg .lang a{color:#1a0dab;margin:0 3px}
/* ---------------- the taskbar */
.task{position:absolute;left:0;bottom:0;width:2560px;height:48px;background:rgba(32,32,36,.92);border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(30px);z-index:5;display:flex;align-items:center}
.center{position:absolute;left:50%;top:0;height:48px;transform:translateX(-50%);display:flex;align-items:center;gap:4px}
.tb{width:44px;height:40px;border-radius:5px;display:flex;align-items:center;justify-content:center;position:relative}
.tb svg{width:26px;height:26px}
.tb.on{background:rgba(255,255,255,.08)}
.tb .run{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:6px;height:3px;border-radius:2px;background:#9d9d9d}
.tb.on .run{width:16px;background:#4cc2ff}
.tray{position:absolute;right:12px;top:0;height:48px;display:flex;align-items:center;gap:2px;color:#fff}
.tray .tbn{height:40px;padding:0 8px;border-radius:5px;display:flex;align-items:center;gap:10px}
.tray svg{width:16px;height:16px}
.clock{text-align:right;font-size:12px;line-height:17px}
</style>
</head>
<body>
<div class="wall"></div>

<div class="nn" id="nn">
  <div class="bar"><span class="ico"></span><span class="t">Nimble Notes</span>
    <span class="wc">
      <span><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></span>
      <span><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor"/></svg></span>
      <span><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></span>
    </span>
  </div>
  <img id="nnimg" alt="">
</div>

<div class="ff" id="ff">
  <div class="tabs">
    <div class="tab on" id="tab1"><span id="fav1"></span><span class="tt" id="title1"></span><span class="x"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="#fbfbfe" stroke-width="1.3"/></svg></span></div>
    <div class="tab off"><span><svg width="16" height="16" viewBox="0 0 16 16"><rect x="0" y="2.5" width="16" height="11" rx="3.2" fill="#ff0033"/><path d="M6.4 5.4v5.2L10.8 8z" fill="#fff"/></svg></span>
      <span class="tt">Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster) - YouTube</span>
      <span class="x"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1l8 8M9 1L1 9" stroke="#fbfbfe" stroke-width="1.3"/></svg></span></div>
    <div class="plus"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="#fbfbfe" stroke-width="1.4"/></svg></div>
    <span class="wc">
      <span><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="#fbfbfe" stroke-width="1"/></svg></span>
      <span><svg viewBox="0 0 10 10"><rect x="2.5" y=".5" width="7" height="7" rx="1.2" fill="none" stroke="#fbfbfe"/><rect x=".5" y="2.5" width="7" height="7" rx="1.2" fill="#1c1b22" stroke="#fbfbfe"/></svg></span>
      <span><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="#fbfbfe" stroke-width="1"/></svg></span>
    </span>
  </div>
  <div class="nav">
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M14 8H3M7.5 3.5L3 8l4.5 4.5" fill="none" stroke="#fbfbfe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="nb" style="opacity:.4"><svg viewBox="0 0 16 16"><path d="M2 8h11M8.5 3.5L13 8l-4.5 4.5" fill="none" stroke="#fbfbfe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3" fill="none" stroke="#fbfbfe" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <div class="url"><svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="6" width="9" height="7" rx="1.5" fill="#fbfbfe"/><path d="M4.5 6V4.5a2.5 2.5 0 0 1 5 0V6" fill="none" stroke="#fbfbfe" stroke-width="1.4"/></svg><span id="url"></span></div>
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="none" stroke="#fbfbfe" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M8 1.5L13.5 3.5V8c0 3-2.4 5.4-5.5 6.5C4.9 13.4 2.5 11 2.5 8V3.5z" fill="none" stroke="#fbfbfe" stroke-width="1.3"/></svg></span>
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M6 2.5h3v2a1.3 1.3 0 0 0 2.6 0v-2H14v4.2h-1.6a1.3 1.3 0 0 0 0 2.6H14v4.2H9.6v-1.6a1.3 1.3 0 0 0-2.6 0v1.6H2.5V8.9h1.6a1.3 1.3 0 0 0 0-2.6H2.5V2.5H6z" fill="none" stroke="#fbfbfe" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
    <span class="nb"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="#fbfbfe" stroke-width="1.3"/><circle cx="8" cy="6.5" r="2.2" fill="none" stroke="#fbfbfe" stroke-width="1.3"/><path d="M4 12.6c1-1.7 2.4-2.4 4-2.4s3 .7 4 2.4" fill="none" stroke="#fbfbfe" stroke-width="1.3"/></svg></span>
    <span class="nb"><svg viewBox="0 0 16 16"><path d="M2.5 4h11M2.5 8h11M2.5 12h11" stroke="#fbfbfe" stroke-width="1.5" stroke-linecap="round"/></svg></span>
  </div>
  <div class="page" id="page"></div>
</div>

<div class="task">
  <div class="center" id="center"></div>
  <div class="tray">
    <span class="tbn"><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="tbn">
      <svg viewBox="0 0 16 16"><path d="M1.5 6.2a9.5 9.5 0 0 1 13 0M3.7 8.6a6.4 6.4 0 0 1 8.6 0M5.9 11a3.2 3.2 0 0 1 4.2 0" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="13.2" r="1" fill="#fff"/></svg>
      <svg viewBox="0 0 16 16"><path d="M2 6h3l4-3.5v11L5 10H2z" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 16 16" style="width:20px"><rect x="1" y="4.5" width="12.5" height="7" rx="1.6" fill="none" stroke="#fff" stroke-width="1.1"/><rect x="2.6" y="6" width="8" height="4" rx=".6" fill="#fff"/><rect x="14" y="6.5" width="1.3" height="3" rx=".5" fill="#fff"/></svg>
    </span>
    <span class="tbn"><span class="clock">4:20 PM<br>4/1/2003</span></span>
    <span class="tbn"><svg viewBox="0 0 16 16"><path d="M8 2a4 4 0 0 0-4 4v3.2L2.7 11.5h10.6L12 9.2V6a4 4 0 0 0-4-4zM6.5 13a1.6 1.6 0 0 0 3 0" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg></span>
  </div>
</div>

<script>
const mode = new URLSearchParams(location.search).get("mode") || "sixth";
const W = 2560, strip = mode === "eighth" ? 320 : 427;
document.getElementById("nn").style.width = strip + "px";
document.getElementById("nnimg").src = "img/desk_app_" + mode + ".png";
document.getElementById("ff").style.left = strip + "px";

/* ---- taskbar icons, drawn here in a Windows 11 style */
const icons = {
  start: `<svg viewBox="0 0 26 26"><defs><linearGradient id="ws" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#52c7f5"/><stop offset="1" stop-color="#0a74da"/></linearGradient></defs>
    <rect x="2" y="2" width="10.5" height="10.5" rx="1.2" fill="url(#ws)"/><rect x="13.5" y="2" width="10.5" height="10.5" rx="1.2" fill="url(#ws)"/>
    <rect x="2" y="13.5" width="10.5" height="10.5" rx="1.2" fill="url(#ws)"/><rect x="13.5" y="13.5" width="10.5" height="10.5" rx="1.2" fill="url(#ws)"/></svg>`,
  firefox: `<svg viewBox="0 0 26 26"><defs>
    <radialGradient id="fg" cx=".55" cy=".35" r=".7"><stop offset="0" stop-color="#ab71ff"/><stop offset=".6" stop-color="#5b2fd6"/><stop offset="1" stop-color="#321c64"/></radialGradient>
    <linearGradient id="fx" x1=".1" y1="1" x2=".9" y2="0"><stop offset="0" stop-color="#ff2e5a"/><stop offset=".45" stop-color="#ff7a1a"/><stop offset="1" stop-color="#ffd23f"/></linearGradient></defs>
    <circle cx="13.5" cy="12.5" r="9.8" fill="url(#fg)"/>
    <path d="M22.8 9.2c1.6 5.6-1.6 12.4-8.6 13.7C7.5 24.1 2 19.6 1.6 13.3c-.2-2.6.6-5 1.9-6.9.1 1.4.7 2.6 1.6 3.4-.3-2.9 1.1-5.6 3.4-7.1-.5 1.9.2 3.6 1.4 4.3 2.9-.9 6.2.2 7.6 2.9-1.4-.6-3-.6-4.4.1 1.8.6 3 2.4 2.8 4.4-.3 2.6-2.8 4.4-5.5 3.9 3.3 2.6 8.5 1.4 10.3-2.5.8-1.7 1-3.6.6-5.4.5.8.9 1.7 1.2 2.6.6-1.3.8-2.6.3-3.8z" fill="url(#fx)"/></svg>`,
  aol: `<svg viewBox="0 0 26 26"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#0b4fc4"/></linearGradient></defs>
    <path d="M13 2.2L24.4 22.6H1.6z" fill="url(#ag)" stroke="#073a96" stroke-width=".6" stroke-linejoin="round"/>
    <circle cx="13.6" cy="9.6" r="2" fill="#ffd200"/>
    <path d="M7.4 20.6c2.2-3.8 4.3-5.9 6.6-6.4 1.6-.3 3 .3 4.2 1.6-1.2-.2-2.3 0-3.2.6 1.2.5 2 1.6 2.4 3.2-1.4-1.3-2.9-1.9-4.6-1.6-1.9.4-3.6 1.4-5.4 2.6z" fill="#fff"/></svg>`,
  prodigy: `<svg viewBox="0 0 26 26"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dcdfe6"/></linearGradient></defs>
    <rect x="1.5" y="1.5" width="23" height="23" rx="5" fill="url(#pg)"/>
    <path d="M5.6 11.2L20.6 10.2 7.8 20.2 12.9 5.2 17.8 20.6Z" fill="none" stroke="#111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.8 3.2L12.4 11.6" stroke="#111" stroke-width="1.3" stroke-linecap="round"/></svg>`,
  napster: `<svg viewBox="0 0 26 26"><g fill="none" stroke="#3c6eb4" stroke-width="2.3" stroke-linejoin="round">
    <path d="M5.6 9.5a7.6 7.6 0 0 1 14.8 0"/>
    <path d="M7.2 9.6L8.2 5.4l3.2 2.5h3.2l3.2-2.5 1 4.2c1.1 1.4 1.7 3.1 1.7 4.9 0 4.6-3.7 8.3-7.5 8.3s-7.5-3.7-7.5-8.3c0-1.8.6-3.5 1.7-4.9z" fill="#fff"/></g>
    <rect x="2.6" y="10.6" width="3.4" height="6.8" rx="1.7" fill="#3c6eb4"/><rect x="20" y="10.6" width="3.4" height="6.8" rx="1.7" fill="#3c6eb4"/>
    <path d="M9.4 13.6h3l-1 2zM16.6 13.6h-3l1 2z" fill="#6cbb4a"/><path d="M11.4 18.2h3.2l-1.6 1.2z" fill="#3c6eb4"/><path d="M11.4 20.2h3.2" stroke="#3c6eb4" stroke-width="1.1" stroke-linecap="round"/></svg>`,
  netscape: `<svg viewBox="0 0 26 26"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b6f73"/><stop offset="1" stop-color="#3aa8ad"/></linearGradient>
    <clipPath id="nc"><rect x="1.5" y="1.5" width="23" height="23" rx="5"/></clipPath></defs>
    <g clip-path="url(#nc)"><rect x="1.5" y="1.5" width="23" height="23" fill="url(#ng)"/>
    <path d="M0 18.6Q13 14.4 26 17.4V26H0z" fill="#050505"/><path d="M0 18.6Q13 14.4 26 17.4" fill="none" stroke="#fff" stroke-width=".7"/></g>
    <text x="13" y="17.2" text-anchor="middle" font-family="Times New Roman,serif" font-weight="700" font-size="15" fill="#fff">N</text></svg>`,
};
const order = [["start", false, false], ["firefox", true, true], ["aol", false, true], ["prodigy", false, true], ["napster", false, true], ["netscape", false, true]];
document.getElementById("center").innerHTML = order.map(([k, on, run]) =>
  `<span class="tb${on ? " on" : ""}">${icons[k]}${run ? '<span class="run"></span>' : ""}</span>`).join("");

/* ---- the page in Firefox */
